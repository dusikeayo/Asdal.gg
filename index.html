```html
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>아스달 지지</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         HEADER
    =============================== -->

    <header>

        <h1>아스달 지지</h1>

        <nav>

            <button
                type="button"
                class="nav-button active"
                data-page="rankingPage"
            >
                랭킹
            </button>

            <button
                type="button"
                class="nav-button"
                data-page="auctionPage"
            >
                거래소
            </button>

        </nav>

    </header>


    <!-- ==============================
         MAIN
    =============================== -->

    <main>


        <!-- ==============================
             랭킹 페이지
        =============================== -->

        <section
            id="rankingPage"
            class="page active-page"
        >

            <div class="ranking">

                <h2>랭킹</h2>


                <!-- 검색 영역 -->

                <div class="search-box">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="닉네임을 검색하세요"
                    >


                    <select id="serverFilter">

                        <option value="all">
                            전체 서버
                        </option>

                    </select>


                    <select id="sortFilter">

                        <option value="power">
                            전투력 높은 순
                        </option>

                        <option value="level">
                            레벨 높은 순
                        </option>

                        <option value="nickname">
                            닉네임 순
                        </option>

                    </select>


                    <select id="historyFilter">

                        <option value="current">
                            현재 랭킹
                        </option>

                    </select>


                    <button
                        id="searchButton"
                        type="button"
                    >
                        검색
                    </button>

                </div>


                <!-- 상태 -->

                <div id="rankingStatus"></div>


                <!-- 랭킹 표 -->

                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>

                                <th>순위</th>

                                <th>닉네임</th>

                                <th>직업</th>

                                <th>레벨</th>

                                <th>전투력</th>

                                <th>서버</th>

                            </tr>

                        </thead>


                        <tbody id="rankingBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </section>



        <!-- ==============================
             거래소 페이지
        =============================== -->

        <section
            id="auctionPage"
            class="page"
        >

            <div class="auction">

                <h2>거래소</h2>


                <!-- 거래소 검색 -->

                <div class="auction-search-box">

                    <input
                        type="text"
                        id="auctionSearchInput"
                        placeholder="아이템 이름을 검색하세요"
                    >

                    <button
                        type="button"
                        id="auctionSearchButton"
                    >
                        검색
                    </button>

                </div>


                <!-- 거래소 상태 -->

                <div
                    id="auctionStatus"
                    class="auction-status"
                >
                    아이템 이름을 검색해주세요.
                </div>


                <!-- 거래소 결과 -->

                <div
                    id="auctionResults"
                    class="auction-results"
                >

                </div>

            </div>

        </section>

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

        <p>아스달 지지</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
```
