<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아스달 지지</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>아스달 지지</h1>

        <nav>
            <a href="#">랭킹</a>
            <a href="#auction">거래소</a>
        </nav>
    </header>


    <main>

        <!-- =========================
             랭킹
        ========================== -->

        <section class="ranking">

            <h2>랭킹</h2>

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="닉네임을 검색하세요"
                >

                <select id="serverFilter">

                    <option value="all">
                        전체 서버
                    </option>

                    <option value="">
                        서버 선택
                    </option>

                </select>

                <select id="sortFilter">

                    <option value="power">
                        전투력 높은 순
                    </option>

                    <option value="level">
                        레벨 높은 순
                    </option>

                    <option value="nickname">
                        닉네임 순
                    </option>

                </select>

                <select id="historyFilter">

                    <option value="current">
                        현재 랭킹
                    </option>

                </select>

                <button id="searchButton">
                    검색
                </button>

            </div>

            <div id="rankingStatus"></div>

            <table>

                <thead>

                    <tr>
                        <th>순위</th>
                        <th>닉네임</th>
                        <th>직업</th>
                        <th>레벨</th>
                        <th>전투력</th>
                        <th>서버</th>
                    </tr>

                </thead>

                <tbody id="rankingBody"></tbody>

            </table>

        </section>


        <!-- =========================
             거래소
        ========================== -->

        <section class="auction" id="auction">

            <h2>거래소</h2>

            <div class="auction-search">

                <input
                    type="text"
                    id="auctionSearchInput"
                    placeholder="아이템 이름을 검색하세요"
                >

                <button id="auctionSearchButton">
                    검색
                </button>

            </div>


            <div id="auctionStatus"></div>


            <table>

                <thead>

                    <tr>
                        <th>아이템</th>
                        <th>등급</th>
                        <th>강화</th>
                        <th>최근 거래가</th>
                        <th>최저가</th>
                        <th>최고가</th>
                        <th>거래량</th>
                        <th>현재 등록가</th>
                        <th>등록 수량</th>
                    </tr>

                </thead>

                <tbody id="auctionBody"></tbody>

            </table>

        </section>

    </main>


    <footer>

        <p>아스달 지지</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
