<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>아스달 지지 관리자</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>아스달 지지 관리자</h1>

    <div class="admin-box">

        <h2>랭킹 등록</h2>

        <label>날짜</label>
        <input type="date" id="rankingDate">


        <label>닉네임</label>
        <input type="text" id="nickname">


        <label>직업</label>
        <input type="text" id="job">


        <label>레벨</label>
        <input type="number" id="level">


        <label>전투력</label>
        <input type="number" id="power">


        <label>서버</label>

        <select id="server">

            <option value="아스달">아스달</option>
            <option value="새녘">새녘</option>

        </select>


        <button id="addRanking">
            랭킹 추가
        </button>

    </div>

</body>

</html>
